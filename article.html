<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Une présentation s'impose — Journal d'une Classe Multiniveaux</title>
<meta name="description" content="Comment je suis passée d'un master en communication au CRPE : remplacements, doutes, classe multiniveaux, et le concours enfin décroché après plusieurs tentatives.">
<link rel="canonical" href="https://journalclassemulti.netlify.app/article.html">
<meta property="og:type" content="article">
<meta property="og:title" content="Une présentation s'impose">
<meta property="og:description" content="Comment je suis passée d'un master en communication au CRPE, entre remplacements et classe multiniveaux.">
<meta property="og:url" content="https://journalclassemulti.netlify.app/article.html">
<meta property="og:locale" content="fr_FR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6F4; --card:#FFFFFF; --ink:#3E3038; --ink-soft:#7A6670;
    --rose:#EBA6B4; --rose-deep:#C4576E; --rose-pale:#FBE4E7;
    --lav:#C9B7DE; --lav-pale:#EFE8F7; --gold:#D9A96B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Poppins',sans-serif; font-weight:300; line-height:1.8;}
  header{display:flex; justify-content:space-between; align-items:center; padding:26px 56px; flex-wrap:wrap; gap:12px;}
  header .brand{font-family:'Fraunces',serif; font-weight:600; font-size:22px; color:var(--rose-deep); text-decoration:none;}
  nav a{color:var(--ink); text-decoration:none; font-size:13px;}

  main{max-width:680px; margin:0 auto; padding:20px 24px 80px;}
  .pill{display:inline-block; font-size:11px; font-weight:500; padding:4px 12px; border-radius:20px; margin-bottom:18px;}
  h1{font-family:'Fraunces',serif; font-weight:500; font-size:36px; margin-bottom:26px; line-height:1.25;}
  article p{font-size:16px; color:var(--ink); margin-bottom:20px;}
  article h2{font-family:'Fraunces',serif; font-weight:500; font-size:22px; color:var(--rose-deep); margin:38px 0 14px;}
  .back{display:inline-block; margin-top:40px; font-size:13px; color:var(--rose-deep); text-decoration:none;}
  .signature{font-family:'Fraunces',serif; font-style:italic; color:var(--rose-deep); margin-top:10px;}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-Q9S7J717ZN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-Q9S7J717ZN');
</script>
</head>
<body>

<header>
  <a href="index.html" class="brand">Journal d'une Classe Multiniveaux</a>
  <nav><a href="index.html">← Retour aux articles</a></nav>
</header>

<main>
  <div id="content">Chargement…</div>
</main>

<script>
const pillColors = {
  "Organisation": {bg:"#EFE8F7", color:"#5B4A7A"},
  "Matériel": {bg:"#FBE4E7", color:"#C4576E"},
  "Retour de classe": {bg:"#FDF0DE", color:"#8A6320"},
  "Présentation": {bg:"#F3E1EC", color:"#8A4A78"}
};

function renderBody(text){
  return text.split(/\n\n+/).map(block => {
    block = block.trim();
    if(block.startsWith('## ')) return `<h2>${block.slice(3)}</h2>`;
    return `<p>${block.replace(/\n/g,'<br>')}</p>`;
  }).join('');
}

const params = new URLSearchParams(window.location.search);
const id = params.get('id');

fetch('content/posts.json')
  .then(r => r.json())
  .then(posts => {
    const post = posts.find(p => p.id === id);
    const el = document.getElementById('content');
    if(!post){
      el.innerHTML = '<p>Article introuvable. <a href="index.html">Retour à l\\'accueil</a></p>';
      return;
    }
    const colors = pillColors[post.tag] || {bg:"#FBE4E7", color:"#C4576E"};
    el.innerHTML = `
      <span class="pill" style="background:${colors.bg}; color:${colors.color};">${post.tag}</span>
      <h1>${post.title}</h1>
      <article>${renderBody(post.content || post.excerpt)}</article>
      <a class="back" href="index.html">← Retour aux articles</a>
    `;
    document.title = post.title + " — Journal d'une Classe Multiniveaux";
  })
  .catch(() => {
    document.getElementById('content').innerHTML = '<p>Impossible de charger l\\'article pour le moment.</p>';
  });
</script>

</body>
</html>
